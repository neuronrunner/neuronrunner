name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('stopwords', quiet=True)"

      - name: Django system check & tests
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-test-secret-key-at-least-32-characters-long"
          SANDBOX_PROVIDER: "docker"
        run: |
          python manage.py check
          python manage.py test app authentication user model mcp openai_compat chat sandbox

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: |
          npm run typecheck
          npm test
          npm run build

  oss-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify zero proprietary cloud or billing leaks
        run: |
          ! grep -rniE "beam\.cloud|beta9|beam-client|creem|dodo|paddle|0x4AAAAA|from billing|import billing|VirtualMachine|VMSnapshot|VMUsageRecord|modal_call_id" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=__pycache__ \
            --exclude=ci.yml .
