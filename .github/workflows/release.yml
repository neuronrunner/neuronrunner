name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('stopwords', quiet=True)"

      - name: Backend check & tests
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: "release-ci-secret-key-at-least-32-characters"
          SANDBOX_PROVIDER: "docker"
        run: |
          python manage.py check
          python manage.py test app authentication user model mcp openai_compat chat sandbox

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Verify sandbox Dockerfile builds
        run: docker build -f Dockerfile.sandbox -t neuronrunner-sandbox:release-check .

  publish-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "NeuronRunner $TAG" --generate-notes
