<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- Light Background Squircle -->
  <rect width="512" height="512" rx="116" fill="#FFFFFF"/>
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="#000000" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Synaptic Edges (3-2-1 Connections) -->
  <g stroke="#0A0A0F" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round">
    <line x1="136" y1="144" x2="256" y2="200"/>
    <line x1="136" y1="144" x2="256" y2="312"/>
    <line x1="136" y1="256" x2="256" y2="200"/>
    <line x1="136" y1="256" x2="256" y2="312"/>
    <line x1="136" y1="368" x2="256" y2="200"/>
    <line x1="136" y1="368" x2="256" y2="312"/>
    <line x1="256" y1="200" x2="376" y2="256"/>
    <line x1="256" y1="312" x2="376" y2="256"/>
  </g>

  <!-- Outer Directional Arrow Path -->
  <path d="M136 144 L256 200 L376 256 L256 312 L136 368" 
        stroke="#0A0A0F" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Input Layer Nodes (L1) -->
  <circle cx="136" cy="144" r="26" fill="#FFFFFF" stroke="#0A0A0F" stroke-width="12"/>
  <circle cx="136" cy="256" r="26" fill="#FFFFFF" stroke="#0A0A0F" stroke-width="12"/>
  <circle cx="136" cy="368" r="26" fill="#FFFFFF" stroke="#0A0A0F" stroke-width="12"/>

  <!-- Hidden Layer Nodes (L2) -->
  <circle cx="256" cy="200" r="26" fill="#FFFFFF" stroke="#0A0A0F" stroke-width="12"/>
  <circle cx="256" cy="312" r="26" fill="#FFFFFF" stroke="#0A0A0F" stroke-width="12"/>

  <!-- Output Layer Node (L3 - Active Execution Node) -->
  <circle cx="376" cy="256" r="38" fill="#0A0A0F"/>
  <circle cx="376" cy="256" r="14" fill="#FFFFFF"/>
</svg>
